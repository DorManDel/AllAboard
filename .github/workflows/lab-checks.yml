name: Mechanics Lab Checks

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check app.js && node --check ocean.js && node --check vessel.js && node --check world.js && node --check flag-workshop.js && node --check mechanics-review.js && node --check mechanic-catalog.js && node --check stage-loop.js && node --check roadmap-board.js && node --check ui-layout.js && node --check map-explorer.js
      - name: Run lab smoke tests
        run: node tests/smoke.cjs
      - name: Run vessel and ocean physics tests
        run: node tests/vessel.cjs
      - name: Test deterministic world generation
        run: node tests/world.cjs
      - name: Test Unity mechanics selection export
        run: node tests/review.cjs
      - name: Test stage and stay-or-leave checkpoint
        run: node tests/stage-loop.cjs
      - name: Test mechanic catalog and Kanban board
        run: node tests/planner.cjs
      - name: Test V0.6 sea/land/map/UI and slower vessel
        run: node tests/core-v06.cjs
