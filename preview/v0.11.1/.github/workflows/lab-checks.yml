name: Mechanics Lab Checks

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check app.js && node --check ocean.js && node --check vessel.js && node --check world.js && node --check flag-workshop.js && node --check mechanics-review.js && node --check mechanic-catalog.js && node --check stage-loop.js && node --check roadmap-board.js && node --check ui-layout.js && node --check map-explorer.js && node --check kraken-grapple.js && node --check game-feel.js && node --check audio-lab.js && node --check unity-readiness.js && node --check v07-lab-ui.js && node --check haptics.js && node --check fullscreen-play.js && node --check nav-ui.js && node --check quick-tutorial.js && node --check flag-motion.js && node --check repair-mini.js
      - name: Run lab smoke tests
        run: node tests/smoke.cjs
      - name: Run vessel and ocean physics tests
        run: node tests/vessel.cjs
      - name: Test deterministic world generation
        run: node tests/world.cjs
      - name: Test Unity mechanics selection export
        run: node tests/review.cjs
      - name: Test stage and stay-or-leave checkpoint
        run: node tests/stage-loop.cjs
      - name: Test mechanic catalog and Kanban board
        run: node tests/planner.cjs
      - name: Test V0.6 sea/land/map/UI and slower vessel
        run: node tests/core-v06.cjs
      - name: Test Kraken grappling encounter
        run: node tests/kraken-grapple.cjs
      - name: Test V0.7 feel, music and Unity QA
        run: node tests/game-feel-audio.cjs
      - name: Test V0.8 HUD advanced editor and rope reeling
        run: node tests/hud-v08.cjs
      - name: Test V0.9 phone HUD, water, flag and repair
        run: node tests/v09-experiments.cjs
      - name: Test V0.10 Sail and HUD editor
        run: node tests/sail-hud-v010.cjs
      - name: Test V0.11 fullscreen and haptic controls
        run: node tests/fullscreen-haptic-v011.cjs
      - name: Test V0.11.1 sail direction and thrust response
        run: node tests/sail-response-v0111.cjs
